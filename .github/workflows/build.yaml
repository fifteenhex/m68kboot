name: Build amiboot
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup environment
      run: sudo apt update && sudo apt install build-essential make wget git gcc g++ lhasa libgmp-dev libmpfr-dev libmpc-dev flex bison gettext texinfo ncurses-dev autoconf rsync libreadline-dev

    - name: Download toolchain
      run: |
        mkdir /opt/amiga &&
        git clone https://github.com/AmigaPorts/m68k-amigaos-gcc.git &&
        cd m68k-amigaos-gcc &&
        make update

    - name: Change GCC branch
      run: make -C m68k-amigaos-gcc branch branch=amiga13.3 mod=gcc

    - name: Build toolchain
      run: make -C m68k-amigaos-gcc binutils gcc
